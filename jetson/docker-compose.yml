name: discrete-reasoning

x-app-base: &app-base
  build:
    context: ..
    dockerfile: jetson/Dockerfile
    args:
      BASE_IMAGE: ${BASE_IMAGE:-whitesscott/l4t-jetpack:r39.2.1}
      TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cu132}
  image: discrete-reasoning:jetson
  working_dir: /workspace
  environment:
    PYTHONPATH: /workspace/src
  volumes:
    - ..:/workspace

services:
  download:
    <<: *app-base
    entrypoint: ["download-dataset"]

  train:
    <<: *app-base
    runtime: nvidia
    entrypoint: ["train"]

  eval:
    <<: *app-base
    runtime: nvidia
    entrypoint: ["eval"]

  viz:
    <<: *app-base
    ports:
      - "8000:8000"
    command:
      - python3
      - -m
      - http.server
      - "8000"
      - --bind
      - 0.0.0.0
      - --directory
      - /workspace
