<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku Extreme Viewer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      max-width: 520px;
      margin: 2rem auto;
      padding: 0 1rem;
      background: #fafafa;
      color: #111;
    }
    h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
    .meta { font-size: 0.85rem; color: #555; margin-bottom: 1rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      width: min(360px, 90vw);
      aspect-ratio: 1;
      border: 2px solid #111;
      background: #fff;
    }
    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1rem, 4vw, 1.4rem);
      font-weight: 500;
      border: 1px solid #ccc;
    }
    .cell.given { background: #fff; color: #111; font-weight: 700; }
    .cell.solution { color: #15803d; }
    .cell.box-right { border-right: 2px solid #111; }
    .cell.box-bottom { border-bottom: 2px solid #111; }
    .controls {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }
    button, label {
      font: inherit;
      padding: 0.4rem 0.75rem;
      cursor: pointer;
    }
    button {
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
    }
    button:hover { background: #f3f4f6; }
    input[type="checkbox"] { margin-right: 0.25rem; }
    .index { margin-left: auto; font-size: 0.85rem; color: #555; }
    .error { color: #b91c1c; }
  </style>
</head>
<body>
  <h1>Sudoku Extreme <a href="training.html">training</a></h1>
  <div class="meta" id="meta">Loading...</div>
  <div class="grid" id="grid"></div>

  <div class="controls">
    <button id="prev">← Prev puzzle</button>
    <button id="next">Next puzzle →</button>
    <label><input type="checkbox" id="showAnswer"> Show answer</label>
    <span class="index" id="index"></span>
  </div>

  <p class="error" id="error"></p>

  <script>
    let puzzles = [];
    let puzzleIdx = 0;

    function parseGrid(s) {
      const grid = [];
      for (let i = 0; i < 9; i++) {
        const row = [];
        for (let j = 0; j < 9; j++) {
          const c = s[i * 9 + j];
          row.push(c === "." ? 0 : parseInt(c, 10));
        }
        grid.push(row);
      }
      return grid;
    }

    function renderPuzzle() {
      const gridEl = document.getElementById("grid");
      const metaEl = document.getElementById("meta");
      const indexEl = document.getElementById("index");
      const showAnswer = document.getElementById("showAnswer").checked;

      if (!puzzles.length) return;

      const p = puzzles[puzzleIdx];
      const question = parseGrid(p.question);
      const answer = parseGrid(p.answer);

      metaEl.textContent = `source: ${p.source} · rating: ${p.rating}`;
      indexEl.textContent = `${puzzleIdx + 1} / ${puzzles.length}`;

      gridEl.innerHTML = "";
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const cell = document.createElement("div");
          cell.className = "cell";
          if (c === 2 || c === 5) cell.classList.add("box-right");
          if (r === 2 || r === 5) cell.classList.add("box-bottom");

          const q = question[r][c];
          const a = answer[r][c];
          if (q !== 0) {
            cell.textContent = q;
            cell.classList.add("given");
          } else if (showAnswer) {
            cell.textContent = a;
            cell.classList.add("solution");
          }
          gridEl.appendChild(cell);
        }
      }
    }

    async function load() {
      const errorEl = document.getElementById("error");
      try {
        const res = await fetch("puzzles.json");
        if (!res.ok) throw new Error("No data files found");
        puzzles = await res.json();
        errorEl.textContent = "";
        renderPuzzle();
      } catch (e) {
        errorEl.textContent = "Could not load data. Run: uv run export-viz, then serve the project root.";
        document.getElementById("meta").textContent = "";
      }
    }

    document.getElementById("prev").onclick = () => {
      puzzleIdx = (puzzleIdx - 1 + puzzles.length) % puzzles.length;
      renderPuzzle();
    };
    document.getElementById("next").onclick = () => {
      puzzleIdx = (puzzleIdx + 1) % puzzles.length;
      renderPuzzle();
    };
    document.getElementById("showAnswer").onchange = renderPuzzle;

    load();
  </script>
</body>
</html>
